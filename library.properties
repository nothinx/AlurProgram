sentence=State machine sederhana berbahasa Indonesia untuk switch-case di loop(), tanpa callback.
paragraph=Tulis tiap tahap sebagai case biasa: baruMasuk() untuk aksi awal, lamaDiTahap() untuk batas waktu, pindah() dan pindahSetelah() untuk berganti tahap. Tahap memakai enum milik sendiri. Tanpa callback, tanpa tabel transisi, tanpa alokasi dinamis, 7 byte RAM di Arduino Uno. Aman saat millis() meluap. English: state machine, finite state machine, FSM, switch case, state timeout, non-blocking, no callbacks, low RAM.
